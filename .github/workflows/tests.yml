name: Eclipse tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  language-tests:
    name: ECL language tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run ECL tests
        run: npm test
